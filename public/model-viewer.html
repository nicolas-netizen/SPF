<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      background: transparent;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --progress-bar-color: #FF6B00;
      --progress-mask: linear-gradient(to right, #FF6B00, #FF8A3D);
    }
  </style>
</head>
<body>
  <model-viewer
    src="base.obj.glb"
    alt="3D Model"
    auto-rotate
    rotation-per-second="30deg"
    exposure="1.5"
    environment-image="neutral"
    shadow-intensity="1.0"
    background-color="transparent"
    camera-controls
    touch-action="pan-y"
    disable-zoom
    interaction-prompt="auto"
    interaction-prompt-threshold="0"
    style="--poster-color: transparent; --interaction-prompt-style: basic;"
  >
    <!-- Material override para aplicar colores -->
    <style>
      model-viewer::part(default-material) {
        --material-color: #FF6B00;
        --material-metalness: 0.8;
        --material-roughness: 0.2;
      }
      
      model-viewer::part(material-1) {
        --material-color: #0066CC;
        --material-metalness: 0.8;
        --material-roughness: 0.2;
      }
    </style>
  </model-viewer>
  
  <script>
    // Cargar configuración desde SPF3D.json
    const modelViewer = document.querySelector('model-viewer');
    
    fetch('SPF3D.json')
      .then(response => response.json())
      .then(config => {
        console.log('Configuración cargada:', config);
        
        // Aplicar configuración
        if (config.exposure) modelViewer.exposure = config.exposure;
        if (config.environmentImage) modelViewer.environmentImage = config.environmentImage;
        if (config.rotationSpeed) modelViewer.rotationPerSecond = config.rotationSpeed;
        if (config.autoRotate !== undefined) modelViewer.autoRotate = config.autoRotate;
      })
      .catch(error => {
        console.log('Error cargando configuración:', error);
      });
  </script>
</body>
</html>
